name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root type-check + build
            command: npm run type-check && npm run build
          - name: i18n parity validate
            command: npm run i18n:validate
          - name: image-studio type-check + build
            command: npm --prefix packages/image-studio run type-check && npm --prefix packages/image-studio run build
          - name: investment type-check + build
            command: npm --prefix packages/investment run type-check && npm --prefix packages/investment run build
          - name: contracts schema tests
            command: npm --prefix packages/contracts run test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
